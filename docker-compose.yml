name: zdm-admin

services:
  mysql:
    image: mysql:8.4
    container_name: zdm-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zdm_admin
      MYSQL_USER: zdm_admin
      MYSQL_PASSWORD: zdm_admin_pwd
      MYSQL_ROOT_PASSWORD: zdm_root_pwd
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    volumes:
      - zdm_platform_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uzdm_admin -pzdm_admin_pwd --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: zdm-platform-backend
    working_dir: /workspace/backend
    command: mvn spring-boot:run
    environment:
      ZDM_DB_URL: jdbc:mysql://mysql:3306/zdm_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      ZDM_DB_USERNAME: zdm_admin
      ZDM_DB_PASSWORD: zdm_admin_pwd
      ZDM_SECURITY_DEV_TOKENS_ENABLED: 'true'
      ZDM_SECURITY_VERIFICATION_CODE: '888888'
      ZDM_CRAFT_IMAGE_DIR: /data/zdm/craft-images
    ports:
      - '8080:8080'
    volumes:
      - .:/workspace
      - zdm_maven_repo:/root/.m2
      - zdm_craft_images:/data/zdm/craft-images
    depends_on:
      mysql:
        condition: service_healthy

  backend-tools:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/backend
    profiles: ['tools']
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      ZDM_SECURITY_DEV_TOKENS_ENABLED: 'true'
      ZDM_SECURITY_VERIFICATION_CODE: '888888'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/workspace
      - zdm_maven_repo:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  zdm_platform_mysql:
  zdm_maven_repo:
  zdm_craft_images:
