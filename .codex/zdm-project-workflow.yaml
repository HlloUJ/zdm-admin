version: 1

project:
  platform: zdm
  id: zdm-admin
  name: 装点猫管理后台
  repository_mode: independent

git:
  remote: origin
  main_branch: main
  task_branch_prefix: codex/

worktrees:
  paths_relative_to: primary_worktree
  task_parent: ../管理后台-worktrees

batch:
  mode: serial
  registry: git-common-dir/task-batches
  preserve_module_commits: true
  commands:
    status: npm run task:batch -- status --json
    start: 'npm run task:start -- --slug "{batch_slug}" --kind "{batch_kind}"'
    delivery_plan: npm run task:batch -- plan --delivery
    rollback_plan: 'npm run task:batch -- plan --rollback "{module_id}"'
    close: npm run task:batch -- close

integration:
  enabled: true
  branch: codex/integration-current
  worktree: ../管理后台-worktrees/integration-current
  reconcile_main: merge
  commands:
    start:
      cwd: integration_worktree
      run: npm run integration:dev
    status:
      cwd: integration_worktree
      run: npm run integration:status
    verify:
      cwd: integration_worktree
      run: npm run integration:verify

preview:
  commands:
    check:
      cwd: integration_worktree
      run: 'npm run dev:task:check -- --worktree "{task_worktree}"'
    start:
      cwd: integration_worktree
      run: 'npm run dev:task -- --worktree "{task_worktree}"'
    temporary:
      cwd: integration_worktree
      run: 'npm run dev:task -- --worktree "{task_worktree}" --temporary'
    database_risk:
      cwd: integration_worktree
      run: 'npm run dev:task -- --worktree "{task_worktree}" --database-risk'
    stop:
      cwd: integration_worktree
      run: 'npm run dev:task:stop -- --worktree "{task_worktree}"'
    handoff:
      cwd: integration_worktree
      run: 'node scripts/delivery-launcher.mjs handoff --task "{task_branch}"'
  urls:
    current_task: http://127.0.0.1:5175
    integration: http://127.0.0.1:5173
    playwright: http://127.0.0.1:5174
  frontend_ports:
    current_task: 5175
    managed_task_upstream: 5176
    temporary_range: 5177-5199
    playwright: 5174
  backend:
    integration_port: 8080
    task_port_range: 8081-8099
    routing:
      frontend_only: integration
      backend_api_migration_or_runtime: task

database:
  strategy: shared-integration
  name: zdm_admin
  migration: flyway
  safety:
    create_task_database: false
    launcher_enforced: true
    backup_for:
      - flyway
      - database-risk
    exclusive_high_risk_writer: true
    handoff_after_integration: true
    destructive_restore_requires_confirmation: true

verification:
  changed: 'npm run check:changed -- {changed_files}'
  delivery: npm run verify:delivery
  full: npm run verify:local
  integration: npm run integration:verify
  evidence:
    version: 2
    directory: .task-verification
    force: npm run verify:local -- --force

delivery:
  completion_gate:
    after_integration_sync:
      - stop_task_preview
      - stop_task_backend
      - ensure_integration_backend_healthy
      - release_owned_database_lock
      - retain_database_backup
    block_completion_on_failure: true
  sync_integration:
    cwd: integration_worktree
    run: 'node scripts/delivery-launcher.mjs sync --task "{task_branch}"'
  reviewed_launcher_candidate:
    cwd: task_worktree
    run: 'node scripts/delivery-launcher.mjs sync --task "{task_branch}" --reviewed-candidate "{task_head}"'
