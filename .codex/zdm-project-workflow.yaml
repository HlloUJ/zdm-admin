version: 1

project:
  platform: zdm
  id: zdm-admin
  name: 装点猫管理后台
  repository_mode: independent

git:
  remote: origin
  main_branch: main
  task_branch_prefix: codex/

worktrees:
  paths_relative_to: primary_worktree
  task_parent: ../管理后台-worktrees

# All repository-cwd commands run in the clean published main anchor.
# task_worktree remains the actual business cwd passed through task:entry.
batch:
  mode: parallel-independent
  registry: git-common-dir/task-registry
  preserve_module_commits: true
  branch_per_task: true
  permanent_worktree_per_task: true
  writable_artifacts: task-private
  legacy_registry: read-only-preserved
  commands:
    status: npm run task:entry -- registry list --json
    resolve: 'npm run task:entry -- registry resolve --task "{batch_slug}"'
    start: 'npm run task:entry -- start --slug "{batch_slug}" --kind "{batch_kind}"'
    delivery_plan: 'npm run task:entry -- --worktree "{task_worktree}" complete plan'

integration:
  enabled: true
  branch: codex/integration-current
  worktree: ../管理后台-worktrees/integration-current
  reconcile_main: merge
  commands:
    start:
      cwd: integration_worktree
      run: npm run integration:dev
    status:
      cwd: integration_worktree
      run: npm run integration:status
    verify:
      cwd: integration_worktree
      run: npm run integration:verify

preview:
  commands:
    check:
      cwd: repository
      run: 'npm run task:entry -- --worktree "{task_worktree}" check'
    start:
      cwd: repository
      run: 'npm run task:entry -- --worktree "{task_worktree}" preview switch --task "{batch_slug}"'
    temporary:
      cwd: repository
      run: 'npm run task:entry -- --worktree "{task_worktree}" temporary'
    combination_plan:
      cwd: repository
      run: 'npm run task:entry -- combination plan "{combination_id}" --member "{member_a}@{member_a_head}" --member "{member_b}@{member_b_head}"'
    combination_create:
      cwd: repository
      run: 'npm run task:entry -- combination create "{combination_id}" --member "{member_a}@{member_a_head}" --member "{member_b}@{member_b_head}"'
    combination_status:
      cwd: repository
      run: 'npm run task:entry -- combination status "{combination_id}"'
    combination_run:
      cwd: repository
      run: 'npm run task:entry -- combination run "{combination_id}"'
    combination_stop:
      cwd: repository
      run: 'npm run task:entry -- combination stop "{combination_id}"'
    contract:
      cwd: repository
      run: 'npm run task:entry -- --worktree "{task_worktree}" complete runtime'
    # Stop and handoff are owned stages of complete/deliver, never global stops.
  urls:
    current_task: http://127.0.0.1:5175
    integration: http://127.0.0.1:5173
    playwright: http://127.0.0.1:5174
  frontend_ports:
    current_task: 5175
    managed_task_upstream: 5176
    temporary_range: 5177-5199
    playwright: 5174
  backend:
    integration_port: 8080
    task_port_range: 8081-8099
    routing:
      frontend_only: proved-compatible-task-backend
      persistent_preview: independent-published-data-and-api
      unavailable: explicit-503-no-integration-fallback
      backend_api_migration_or_runtime: task

database:
  strategy: per-task-and-published-preview-isolated-from-integration
  integration_name: zdm_admin
  legacy_preview_registry: git-common-dir/preview-environment/environment.json
  task_registry: git-common-dir/task-environments/<task-id>/environment.json
  published_preview_registry: git-common-dir/preview-environment/published/environment.json
  preview_identity: runtime-profile-no-credentials-in-config
  migration: flyway
  safety:
    create_task_database: explicit-preparation-only
    retain_preview_database_and_media: true
    auto_rebuild_missing_preview_data: false
    launcher_enforced: true
    backup_for:
      - flyway
      - database-risk
    exclusive_high_risk_writer: true
    handoff_after_integration: true
    destructive_restore_requires_confirmation: true

verification:
  changed: 'npm run check:changed -- {changed_files}'
  delivery: npm run verify:delivery
  full: npm run verify:local
  integration: npm run integration:verify
  evidence:
    version: 4
    directory: .task-verification
    force: npm run verify:local -- --force

delivery:
  serialization: fifo-final-main-ci-handoff-settlement
  queue: git-common-dir/task-registry/delivery-queue.json
  freeze: original-source-never-rebaselined
  completion:
    cwd: repository
    run: 'npm run task:entry -- --worktree "{task_worktree}" complete deliver "{batch_slug}" "{task_head}"'
  plan:
    cwd: repository
    run: 'npm run task:entry -- --worktree "{task_worktree}" complete plan'
  asset_preservation:
    cwd: repository
    run: 'npm run task:entry -- --worktree "{task_worktree}" complete preserve'
  completion_gate:
    after_integration_sync:
      - stop_task_preview
      - stop_task_backend
      - ensure_integration_backend_healthy
      - release_owned_database_lock
      - retain_database_backup
    block_completion_on_failure: true
  # main_head is the exact merged main SHA returned by the successful main CI wait.
  final_handoff:
    cwd: repository
    run: 'npm run task:entry -- --worktree "{task_worktree}" complete final-handoff "{main_head}"'
  # Early combination acceptance only; ordinary independent-task delivery uses final_handoff.
  sync_integration:
    cwd: integration_worktree
    run: 'node scripts/delivery-launcher.mjs sync --task "{task_branch}"'
  reviewed_launcher_candidate:
    cwd: task_worktree
    run: 'node scripts/delivery-launcher.mjs sync --task "{task_branch}" --reviewed-candidate "{task_head}"'
